spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# Expose actuator endpoints including Prometheus for scraping
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Reduce actuator sensitive exposure in prod via profiles; tests run with 'test' profile
# Ensure Prometheus metrics are available
management.metrics.export.prometheus.enabled=true

# Maximum allowed payload size (bytes) for incoming audit event payloads
audit.payload.max-bytes=8192